name: Build win-arm64

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish win-arm64 (framework-dependent, single-file)
        run: |
          dotnet publish Ui/Ui.csproj -c Release -r win-arm64 --self-contained false \
            -p:EnableWindowsTargeting=true -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true -o publish/fdd

      - name: Publish win-arm64 (self-contained, single-file, compressed)
        run: |
          dotnet publish Ui/Ui.csproj -c Release -r win-arm64 --self-contained true \
            -p:EnableWindowsTargeting=true -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:EnableCompressionInSingleFile=true -o publish/sc

      - name: Pack
        run: |
          echo "SHA7=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          (cd publish/fdd && zip -9 "../../1Remote-win-arm64-fdd-${GITHUB_SHA::7}.zip" 1Remote.exe)
          (cd publish/sc  && zip -9 "../../1Remote-win-arm64-sc-${GITHUB_SHA::7}.zip" 1Remote.exe)

      - name: Upload artifact (framework-dependent)
        uses: actions/upload-artifact@v4
        with:
          name: 1Remote-win-arm64-fdd-${{ env.SHA7 }}
          path: 1Remote-win-arm64-fdd-*.zip
          if-no-files-found: error

      - name: Upload artifact (self-contained)
        uses: actions/upload-artifact@v4
        with:
          name: 1Remote-win-arm64-sc-${{ env.SHA7 }}
          path: 1Remote-win-arm64-sc-*.zip
          if-no-files-found: error
